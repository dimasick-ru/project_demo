<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход сотрудников · Рецепты долголетия</title><link href="/static/vendor/bootstrap.min.css" rel="stylesheet"><link href="/static/app.css" rel="stylesheet"></head>
<body class="login-body"><main class="login-card"><a class="brand" href="/login"><span class="brand-mark">р</span><span>Рецепты<br><strong>долголетия</strong></span></a><div class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</div><h1 class="mt-3">Рады вас видеть</h1><p class="text-secondary mb-4">Войдите под своей учётной записью сотрудника.</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form action="/login" method="post"><input type="hidden" name="_csrf" value="{{ login_csrf }}"><div class="mb-3"><label for="username" class="form-label">Логин</label><input class="form-control" id="username" name="username" autocomplete="username" maxlength="64" value="{{ username }}" required autofocus></div><div class="mb-4"><label for="password" class="form-label">Пароль</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required></div><button type="submit" class="btn btn-primary w-100">Войти в рабочее пространство →</button></form><p class="form-text mt-4 mb-0">Учётную запись и права доступа назначает руководитель.</p></main></body></html>
