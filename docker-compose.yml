services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations/001_prototype.sql:/docker-entrypoint-initdb.d/002_prototype.sql:ro
      - ./database/migrations/002_access.sql:/docker-entrypoint-initdb.d/003_access.sql:ro
volumes:
  postgres_data:
